# 正式／類正式環境：docker compose up -d --build
# 開發：docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proofforge}
      POSTGRES_USER: ${POSTGRES_USER:-proofforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 預設連到上面的 db 服務；若要用外部資料庫，在 .env 設定 DATABASE_URL 覆寫
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-proofforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proofforge}}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
