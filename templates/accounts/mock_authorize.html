{% extends "base.html" %}{% block title %}開發登入 - ProofForge{% endblock %}{% block content %}
<h1>開發登入(Mock)</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="state" value="{{ state }}">
<p><label for="student_id">學號</label> <input id="student_id" name="student_id" value="{{ student_id }}" required autofocus></p>
<p><label for="name">姓名</label> <input id="name" name="name" value="{{ name }}"></p>
<button type="submit">登入</button></form>{% endblock %}
